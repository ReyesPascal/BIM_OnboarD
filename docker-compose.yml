services:
  bim-academy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bim-onboarding-academy
    restart: unless-stopped
    ports:
      - "1339:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
